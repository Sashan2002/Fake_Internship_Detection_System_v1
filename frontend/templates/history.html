{% extends "base.html" %}
{% block title %}History — Internship Advert Review{% endblock %}
{% block content %}
<h1>Analysis history</h1>
<p class="muted">Previously submitted advertisements and their most recent results.</p>

<div class="panel">
  <table class="history-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Submitted</th>
        <th>Result</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="history-body">
      <tr><td colspan="4" class="muted">Loading…</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
