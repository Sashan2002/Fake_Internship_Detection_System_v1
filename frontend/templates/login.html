<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Internship Advert Review</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/"><span class="mark"></span> Internship Advert Review</a>
    </header>
    <main class="narrow">
      <div class="panel">
        <div class="panel-header">
          <h1 id="form-title" style="font-size:1.4rem;margin:0;">Sign in</h1>
          <a href="#" id="toggle-mode" class="meta">Need an account? Register</a>
        </div>

        <div id="errors" class="error-list hidden"></div>

        <form id="auth-form">
          <div class="field hidden" id="name-field">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn" id="submit-btn">Sign in</button>
        </form>

        <p class="notice">
          This tool provides decision support for reviewing internship advertisements.
          It does not replace independent verification of an employer.
        </p>
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
